# وكيل عكسي مع TLS لتطبيق TG Monitor (P4-ز).
#
# البنية: nginx يستقبل HTTPS ويخدم ملفات الواجهة المبنية (SPA) ويمرّر /api إلى الخدمة على 127.0.0.1:4000.
# الخدمة نفسها **لا تُعرَّض للإنترنت مباشرة**: API_HOST=127.0.0.1 في api.env، وufw/firewalld يمنع 4000.
#
# التركيب:
#   install -m 644 deploy/nginx/tg-monitor.conf /etc/nginx/sites-available/tg-monitor.conf
#   ln -sf /etc/nginx/sites-available/tg-monitor.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# استبدل monitor.example.com باسمك، ونفّذ certbot قبل التشغيل (runbook §4).

# ——— مناطق تحديد المعدل (طبقة إضافية فوق تحديد المعدل داخل التطبيق) ———
# التطبيق يحدّ بالحساب/العنوان؛ هذا يحمي من الغزو قبل الوصول إلى Node أصلاً.
limit_req_zone $binary_remote_addr zone=tg_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tg_api:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=tg_conn:10m;

upstream tg_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# إعادة توجيه HTTP إلى HTTPS (مع استثناء فحص ACME).
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.example.com;

    # ——— TLS ———
    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;

    # ——— ترويسات أمان (لا تُحمّل أي مورد خارجي) ———
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # الواجهة SPA بلا سكربتات مضمّنة ولا خطوط خارجية؛ الاتصالات كلها إلى نفس الأصل.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ——— حدود عامة ———
    client_max_body_size 256k;      # التطبيق نفسه يحدّ JSON بـ64KB
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn tg_conn 20;
    server_tokens off;

    access_log /var/log/nginx/tg-monitor.access.log;
    error_log  /var/log/nginx/tg-monitor.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ——— فحوص الصحة: بلا سجلات وصول (قد تُطلب كل 10 ثوانٍ) ———
    location = /healthz {
        access_log off;
        proxy_pass http://tg_api;
        include /etc/nginx/snippets/tg-proxy.conf;
    }
    location = /readyz {
        access_log off;
        proxy_pass http://tg_api;
        include /etc/nginx/snippets/tg-proxy.conf;
    }

    # ——— تسجيل الدخول والتسجيل: أشدّ تحديداً ———
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=tg_auth burst=5 nodelay;
        proxy_pass http://tg_api;
        include /etc/nginx/snippets/tg-proxy.conf;
    }

    # ——— بقية الـAPI ———
    location /api/ {
        limit_req zone=tg_api burst=60 nodelay;
        proxy_pass http://tg_api;
        include /etc/nginx/snippets/tg-proxy.conf;
    }

    # ——— الواجهة المبنية ———
    root /opt/tg-monitor/apps/web/dist;
    index index.html;

    # الأصول ذات البصمة في اسمها: تخزين طويل بلا إعادة تحقق.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html لا يُخزَّن: كل إصدار جديد يُلتقط فوراً.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # SPA: أي مسار غير معروف يعود إلى index.html (والتوجيه داخل التطبيق).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
