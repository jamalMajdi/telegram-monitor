# ترويسات الوكي العكسي المشتركة بين مسارات API (P4-ز).
#
# مبدأ: Node يعرف العنوان الحقيقي للعميل (فحص IP، تحديد المعدل، وسجل التدقيق) بلا ثقة عمياء:
# لا نمرّر X-Forwarded-* كما وردت، بل نستبدلها بالقيم التي رآها nginx نفسه.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_redirect off;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_buffering on;
proxy_buffers 16 16k;
proxy_busy_buffers_size 32k;

# لا يُعاد استخدام اتصال لخدمة ميتة؛ 502 واضح أفضل من تعليق.
proxy_next_upstream error timeout http_502 http_503 http_504;
